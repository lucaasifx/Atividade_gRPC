syntax = "proto3";
message Void {}
message Task {
  int32 id = 1;
  string title = 2;
  string description = 3;
  bool status = 4;
  string data = 5;
  string responsible = 6;
}
message TaskID {
  int32 id = 1;
}
message TaskList {
  repeated Task list = 1;
}
service API {
  rpc AddTask (Task) returns (Task);
  rpc ListAll (Void) returns (TaskList);
  rpc UpdateTask (TaskID) returns (Task);
  rpc DeleteTask (TaskID) returns (Task);
  rpc FinishTask (TaskID) returns (Task);
}